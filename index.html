<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>인바디</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,"Noto Sans KR",sans-serif;background:#f6f6f6;color:#222;padding-bottom:90px}
button{background:none;border:0;cursor:pointer;font:inherit;color:inherit}
header{background:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid #ddd}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-weight:800;font-size:22px}
nav{display:flex}nav button{flex:1;padding:12px 0;font-size:15px;color:#999;border-bottom:3px solid transparent}
nav button.on{color:#111;font-weight:700;border-color:#222}
main{padding:12px}
.cards{display:flex;gap:8px}
.card{flex:1;background:#fff;border-radius:16px;padding:12px 4px;text-align:center;border:3px solid transparent;box-shadow:0 1px 6px #0001}
.card.on{border-color:#6b7a90}.card small{font-size:12px}.card b{display:block;font-size:30px;margin:6px 0}
.badge{display:inline-block;color:#fff;border-radius:14px;padding:5px 12px;font-size:13px;font-weight:700}
.ok{background:#46b898}.high{background:#f25c73}.low{background:#5b8def}.none{background:#aaa}
.box{background:#fff;border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 1px 6px #0001}
.box h3{font-size:15px;margin-bottom:6px}
.tip{display:inline-block;background:#eef0f4;border-radius:8px;padding:6px 10px;font-size:14px;margin-bottom:4px}
svg{width:100%;height:auto;display:block}
.bar{position:relative;height:10px;background:#e4e6ea;border-radius:5px;margin:10px 0 2px}
.bar i{position:absolute;top:0;bottom:0;background:#46b898;border-radius:5px}
.bar u{position:absolute;top:-4px;width:4px;height:18px;background:#222;border-radius:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.grid div{background:#fff;border-radius:12px;padding:6px;font-size:13px;text-align:center}
.grid img,.box img{width:100%;border-radius:8px}
#fab{position:fixed;right:18px;bottom:22px;width:56px;height:56px;border-radius:28px;background:#222;color:#fff;font-size:30px;box-shadow:0 2px 10px #0004;z-index:6}
.modal{position:fixed;inset:0;background:#fff;z-index:20;overflow:auto;padding:16px}
.f{display:block;margin:8px 0;font-size:14px}.f input,.modal input[type=datetime-local]{width:100%;padding:9px;border:1px solid #ccc;border-radius:8px;font-size:16px}
.f em{font-style:normal;color:#888;font-size:12px;margin-left:6px}
.warn input{border:2px solid #f25c73;background:#fff0f2}.warn em{color:#f25c73;font-weight:700}
.btn{padding:12px 22px;border-radius:10px;background:#222;color:#fff;margin-right:8px}.btn.g{background:#ddd;color:#222}
.viewer{position:fixed;inset:0;background:#000;z-index:30;display:flex;overflow-x:auto;scroll-snap-type:x mandatory}
.slide{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;overflow:auto}
.slide img{max-width:100%;max-height:86vh}.slide p{margin:8px}
.x{position:fixed;top:12px;right:16px;color:#fff;font-size:28px;z-index:31}
</style></head><body>
<header><div class="top"><span>InBody</span><button onclick="setup()">⚙</button></div>
<nav><button data-t="dash" onclick="T='dash';render()">대시보드</button><button data-t="detail" onclick="T='detail';render()">상세</button><button data-t="change" onclick="T='change';render()">변화</button><button data-t="photos" onclick="T='photos';render()">결과지</button></nav></header>
<main id="M"></main><button id="fab" onclick="add()">+</button>
<script>
const ITEMS=[["score","인바디점수","점"],["bmr","기초대사량","kcal"],["weight","체중","kg"],["smm","골격근량","kg"],["fat","체지방량","kg"],["bmi","BMI","kg/m²"],["pbf","체지방률","%"],["whr","복부지방률",""],["vfa","내장지방단면적","cm²"],["water","체수분","kg"],["protein","단백질","kg"]];
const COL={ok:"#46b898",high:"#f25c73",low:"#5b8def",none:"#9aa"},LAB={ok:"표준",high:"표준이상",low:"표준이하",none:"범위없음"};
let S={recs:[],ranges:{}};try{S=JSON.parse(localStorage.ib)||S}catch(e){}
let T="dash",DK="weight",DI=null,P=0,SEL={};
const M=document.getElementById("M"),$=id=>document.getElementById(id);
const save=()=>{S.recs.sort((a,b)=>a.t<b.t?-1:1);try{localStorage.ib=JSON.stringify(S)}catch(e){alert("저장 공간이 부족합니다")}};
const DB=new Promise(r=>{const q=indexedDB.open("ib",1);q.onupgradeneeded=()=>q.result.createObjectStore("p");q.onsuccess=()=>r(q.result)});
const idb=async(m,k,v)=>{const d=await DB;return new Promise(r=>{const s=d.transaction("p",m=="get"?"readonly":"readwrite").objectStore("p");const q=m=="get"?s.get(k):m=="put"?s.put(v,k):s.delete(k);q.onsuccess=()=>r(q.result)})};
const hydrate=()=>document.querySelectorAll("img[data-id]").forEach(async im=>{const b=await idb("get",+im.dataset.id);if(b)im.src=URL.createObjectURL(b)});
const fmt=t=>t.slice(2,16).replace("T"," ").replace(/-/g,".");
const st=(k,v)=>{const r=S.ranges[k];if(!r||r[0]==null||r[1]==null||v==null)return"none";return v<r[0]?"low":v>r[1]?"high":"ok"};
const EMPTY='<div class="box">오른쪽 아래 + 버튼으로 첫 인바디 사진을 올려 주세요.</div>';
const pick=(k,i)=>{SEL[k]=i;render()};

function chart(k,recs){
 const it=ITEMS.find(x=>x[0]==k),pts=recs.filter(r=>r.v[k]!=null);if(!pts.length)return"";
 const W=340,H=150,px=26,py=24,vs=pts.map(r=>r.v[k]);let a=Math.min(...vs),b=Math.max(...vs);if(a==b){a-=1;b+=1}
 const X=i=>pts.length==1?W/2:px+i*(W-2*px)/(pts.length-1),Y=v=>H-py-(v-a)/(b-a)*(H-2*py);
 const s=Math.min(SEL[k]??pts.length-1,pts.length-1);
 let g=`<line x1="${X(s)}" y1="4" x2="${X(s)}" y2="${H-6}" stroke="#bbb" stroke-dasharray="4"/><path d="${pts.map((r,i)=>(i?"L":"M")+X(i)+","+Y(r.v[k])).join("")}" fill="none" stroke="#d5d8de" stroke-width="3"/>`;
 pts.forEach((r,i)=>{const v=r.v[k],x=X(i),y=Y(v);
  g+=`<circle cx="${x}" cy="${y}" r="5" fill="${COL[st(k,v)]}"/>`;
  if(pts.length<=8)g+=`<text x="${x}" y="${y-10}" font-size="10" font-weight="700" text-anchor="middle">${v}</text>`;
  if(pts.length<=6||i==0||i==pts.length-1)g+=`<text x="${x}" y="${H+8}" font-size="9" fill="#888" text-anchor="middle">${r.t.slice(2,10).replace(/-/g,".")}</text>`;
  g+=`<circle cx="${x}" cy="${y}" r="16" fill="transparent" onclick="pick('${k}',${i})"/>`});
 return`<div class="tip">${fmt(pts[s].t)} <b>${pts[s].v[k]}${it[2]}</b></div><svg viewBox="0 0 340 160">${g}</svg>`}

function dash(){
 if(!S.recs.length)return EMPTY;const l=S.recs[S.recs.length-1];
 const cards=["weight","smm","pbf"].map(k=>{const it=ITEMS.find(x=>x[0]==k),v=l.v[k],s=st(k,v);
  return`<button class="card ${DK==k?"on":""}" onclick="DK='${k}';render()"><small>${it[1]} (${it[2]})</small><b>${v??"-"}</b><span class="badge ${s}">${LAB[s]}</span></button>`}).join("");
 return`<div class="cards">${cards}</div><div class="box"><h3>${ITEMS.find(x=>x[0]==DK)[1]}</h3>${chart(DK,S.recs)}</div>`}

function detail(){
 if(!S.recs.length)return EMPTY;DI=Math.min(DI??S.recs.length-1,S.recs.length-1);const r=S.recs[DI];
 let h=`<div class="box" style="display:flex;justify-content:space-between;align-items:center"><button onclick="DI=Math.max(0,DI-1);render()">‹</button><b>${fmt(r.t)}</b><button onclick="DI=Math.min(S.recs.length-1,DI+1);render()">›</button></div>`;
 ITEMS.forEach(([k,n,u])=>{const v=r.v[k];if(v==null)return;const s=st(k,v),g=S.ranges[k];let bar="";
  if(s!="none"){const sp=g[1]-g[0]||1,a=g[0]-sp,b=g[1]+sp,c=x=>Math.max(0,Math.min(100,(x-a)/(b-a)*100));
   bar=`<div class="bar"><i style="left:${c(g[0])}%;width:${c(g[1])-c(g[0])}%"></i><u style="left:${c(v)}%"></u></div>`}
  h+=`<div class="box"><div style="display:flex;justify-content:space-between"><span>${n}</span><span class="badge ${s}">${LAB[s]}</span></div><b style="font-size:22px">${v}</b> ${u}${bar}</div>`});
 h+=`<div class="box"><h3>인바디 결과지 원문</h3><img data-id="${r.id}" onclick="view(${DI})"><p style="margin-top:10px"><button class="badge none" onclick="del(${r.id})">이 기록 삭제</button></p></div>`;return h}

function change(){
 if(!S.recs.length)return EMPTY;
 const cut=P?new Date(Date.now()-P*864e5-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16):"",rs=S.recs.filter(r=>r.t>=cut);
 let h=`<select onchange="P=+this.value;render()" style="padding:8px;font-size:15px">${[[0,"전체"],[365,"최근 1년"],[180,"최근 6개월"]].map(([d,n])=>`<option value="${d}" ${P==d?"selected":""}>${n}</option>`).join("")}</select>`;
 ITEMS.forEach(([k,n,u])=>{const c=chart(k,rs);if(c)h+=`<div class="box"><h3>${n} (${u})</h3>${c}</div>`});return h}

function photos(){
 if(!S.recs.length)return EMPTY;
 return`<div class="grid">${S.recs.map((r,i)=>[r,i]).reverse().map(([r,i])=>`<div onclick="view(${i})"><img data-id="${r.id}"><br>${fmt(r.t)}</div>`).join("")}</div>`}

function view(i){
 const v=document.createElement("div");v.className="viewer";
 v.innerHTML=S.recs.map(r=>`<div class="slide"><p>${fmt(r.t)}</p><img data-id="${r.id}"></div>`).join("")+'<button class="x">✕</button>';
 document.body.append(v);v.querySelector(".x").onclick=()=>v.remove();hydrate();v.scrollLeft=i*innerWidth}

async function del(id){if(!confirm("이 기록을 삭제할까요?"))return;S.recs=S.recs.filter(r=>r.id!=id);await idb("del",id);DI=null;save();render()}

async function shrink(f){const b=await createImageBitmap(f),s=Math.min(1,1600/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=b.width*s;c.height=b.height*s;c.getContext("2d").drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,"image/jpeg",.8))}
function parse(t){const o={};t.replace(/([a-z]+)\s*[=:]\s*([0-9T:\-.]+)/gi,(m,k,v)=>{k=k.toLowerCase();if(k=="date")o.date=v;else if(ITEMS.some(x=>x[0]==k)&&!isNaN(parseFloat(v)))o[k]=parseFloat(v)})
 return o}
const prev=k=>{for(let i=S.recs.length-1;i>=0;i--)if(S.recs[i].v[k]!=null)return S.recs[i].v[k]};
function chk(){ITEMS.forEach(([k])=>{const e=$("in_"+k),p=prev(k),v=parseFloat(e.value.replace(",","."));
 $("pr_"+k).textContent=p!=null?"이전 "+p:"";e.parentNode.classList.toggle("warn",p!=null&&!isNaN(v)&&Math.abs(v-p)/p>.05)})}

function add(){
 let blob=null;const d=document.createElement("div");d.className="modal";
 const now=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
 d.innerHTML=`<h3>기록 추가</h3><p style="margin:10px 0"><input type="file" accept="image/*" id="f"></p><img id="pv" style="width:100%;display:none;border-radius:12px"><textarea id="tx" rows="3" placeholder="채팅에서 받은 한 줄을 여기에 붙여넣으세요" style="width:100%;padding:9px;border:1px solid #ccc;border-radius:8px;font-size:15px;margin-top:10px"></textarea><p style="margin:8px 0"><button class="btn" id="fill">붙여넣은 값 채우기</button></p><p id="sv" style="margin:8px 0;color:#666"></p><p>날짜 <input type="datetime-local" id="dt" value="${now}"></p>${ITEMS.map(([k,n,u])=>`<label class="f">${n} ${u}<em id="pr_${k}"></em><input id="in_${k}" inputmode="decimal" oninput="chk()"></label>`).join("")}<p style="margin-top:14px"><button class="btn" id="ok">저장</button><button class="btn g" id="no">취소</button></p>`;
 document.body.append(d);chk();
 $("no").onclick=()=>d.remove();
 $("f").onchange=async e=>{const f=e.target.files[0];if(!f)return;blob=await shrink(f);$("pv").src=URL.createObjectURL(blob);$("pv").style.display="block"};
 $("fill").onclick=()=>{const o=parse($("tx").value);let n=0;for(const k in o){if(k=="date"){$("dt").value=o.date.length==10?o.date+"T12:00":o.date;continue}$("in_"+k).value=o[k];n++}chk();$("sv").textContent=n?n+"개 항목을 채웠습니다. 빨간 칸은 이전과 차이가 큽니다. 확인해 주세요.":"붙여넣은 내용에서 값을 찾지 못했습니다."};
 $("ok").onclick=async()=>{const v={};ITEMS.forEach(([k])=>{const x=parseFloat($("in_"+k).value.replace(",","."));if(!isNaN(x))v[k]=x});
  if(!Object.keys(v).length)return alert("값을 하나 이상 입력해 주세요");
  const id=Date.now();if(blob)await idb("put",id,blob);S.recs.push({id,t:$("dt").value,v});save();d.remove();DI=null;render()}}

function setup(){
 const d=document.createElement("div");d.className="modal";
 d.innerHTML=`<h3>표준 범위 설정</h3><p style="color:#666;margin:6px 0">인바디 결과지에 나온 표준 범위(최소~최대)를 한 번만 입력하세요.</p>${ITEMS.map(([k,n,u])=>{const r=S.ranges[k]||[];return`<label class="f">${n} ${u}<div style="display:flex;gap:8px"><input id="a_${k}" inputmode="decimal" placeholder="최소" value="${r[0]??""}"><input id="b_${k}" inputmode="decimal" placeholder="최대" value="${r[1]??""}"></div></label>`}).join("")}<p style="margin-top:14px"><button class="btn" id="ok">저장</button><button class="btn g" id="no">취소</button></p>`;
 document.body.append(d);$("no").onclick=()=>d.remove();
 $("ok").onclick=()=>{ITEMS.forEach(([k])=>{const a=parseFloat($("a_"+k).value.replace(",",".")),b=parseFloat($("b_"+k).value.replace(",","."));if(isNaN(a)||isNaN(b))delete S.ranges[k];else S.ranges[k]=[a,b]});save();d.remove();render()}}

function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==T));M.innerHTML={dash,detail,change,photos}[T]();hydrate()}
render();
</script></body></html>
